  var ub = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  var bu = function(a){ var s=''; for (var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
  var gate = document.getElementById('gate'), m = document.getElementById('m'), btn = document.getElementById('b');
  if (!window.crypto || !crypto.subtle) { gate.hidden = false; m.className='msg bad'; m.textContent = 'This browser can’t open the hub. Please use an up-to-date Chrome, Edge or Safari.'; btn.disabled = true; return; }
  function openWith(raw){
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv: ub(P.iv)}, k, ub(P.ct)); })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        // replace this lock screen with the real page once the browser has finished loading it
        var show = function(){ setTimeout(function(){ document.open(); document.write(html); document.close(); }, 0); };
        if (document.readyState === 'complete') show(); else window.addEventListener('load', show, {once:true});
      });
  }
  function tryCode(code){
    var norm = code.toUpperCase().replace(/[^A-Z0-9]/g,'');
    return crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){ return crypto.subtle.deriveKey({name:'PBKDF2', salt: ub(P.salt), iterations: P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']); })
      .then(function(kek){
        var i = 0;
        function next(){
          if (i >= P.slots.length) return Promise.reject(new Error('nomatch'));
          var s = P.slots[i++];
          return crypto.subtle.decrypt({name:'AES-GCM', iv: ub(s.iv)}, kek, ub(s.ct)).then(function(k){ return new Uint8Array(k); }, next);
        }
        return next();
      });
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved) {
    openWith(ub(saved)).catch(function(){ try { localStorage.removeItem(KEY); } catch(e) {} gate.hidden = false; });
  } else { gate.hidden = false; document.getElementById('c').focus(); }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var code = document.getElementById('c').value;
    if (!code.trim()) return;
    btn.disabled = true; m.className = 'msg'; m.textContent = 'Checking…';
    tryCode(code).then(function(raw){
      try { localStorage.setItem(KEY, bu(raw)); } catch(err) {}
      m.className = 'msg ok'; m.textContent = 'Code accepted — opening…';
      return openWith(raw);
    }).catch(function(){
      btn.disabled = false; m.className = 'msg bad'; m.textContent = 'That code isn’t right. Check it and try again.';
    });
  });
})();
</script>
</body>
</html>
